[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "classroom-session-auth"
version = "0.1.0"
description = "Email authentication and deadline reporting for a small course service"
requires-python = ">=3.11"
dependencies = [
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
classroom-api = "classroom_auth.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/classroom_auth"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
